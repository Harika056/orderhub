# Run everything:  docker compose up --build
# Needs roughly 4 GB of free RAM (seven JVMs, Kafka, Postgres and Redis).
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  eureka:
    build:
      context: .
      args:
        MODULE: discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      - eureka
    restart: on-failure

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: orderhub
      SPRING_DATASOURCE_PASSWORD: orderhub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
      redis:
        condition: service_started
    restart: on-failure

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: orderhub
      SPRING_DATASOURCE_PASSWORD: orderhub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
    restart: on-failure

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: orderhub
      SPRING_DATASOURCE_PASSWORD: orderhub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
    restart: on-failure

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: orderhub
      SPRING_DATASOURCE_PASSWORD: orderhub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
    restart: on-failure
